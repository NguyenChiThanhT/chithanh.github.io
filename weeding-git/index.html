<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Ứng dụng chia sẻ link (Zalo, Messenger) đọc 3 dòng dưới, không đọc config.js: nhớ sửa tay khi đổi tên. -->
  <title>Chí Thanh &amp; Hoài Ngọc · Thiệp cưới</title>
  <meta name="description" content="Trân trọng kính mời bạn tới chung vui trong ngày trọng đại của chúng tôi.">
  <meta property="og:title" content="Chí Thanh &amp; Hoài Ngọc · Thiệp cưới">
  <meta name="theme-color" content="#5a000d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Playfair+Display:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E5%9B%8D&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="locked">
  <svg class="sprite" aria-hidden="true">
    <defs>
      <radialGradient id="g-lantern" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#ff5a4a"/>
        <stop offset=".55" stop-color="#d0141e"/>
        <stop offset="1" stop-color="#7d0010"/>
      </radialGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff1c1"/>
        <stop offset=".5" stop-color="#e8b65a"/>
        <stop offset="1" stop-color="#b9822c"/>
      </linearGradient>
    </defs>
    <symbol id="s-lantern" viewBox="0 0 60 124">
      <line x1="30" y1="0" x2="30" y2="22" stroke="#e8b65a" stroke-width="1.5"/>
      <rect x="19" y="19" width="22" height="9" rx="2.5" fill="url(#g-gold)"/>
      <ellipse cx="30" cy="56" rx="27" ry="30" fill="url(#g-lantern)"/>
      <path d="M30 26C12 34 12 78 30 86M30 26C48 34 48 78 30 86M30 26C22 36 22 76 30 86M30 26C38 36 38 76 30 86" stroke="#6b000d" stroke-opacity=".45" fill="none"/>
      <text x="30" y="64" text-anchor="middle" font-size="21" fill="#ffd77a" font-family="'Noto Serif TC', serif" font-weight="900">囍</text>
      <rect x="19" y="84" width="22" height="9" rx="2.5" fill="url(#g-gold)"/>
      <path d="M25 93v24M30 93v29M35 93v24" stroke="#e8b65a" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-cloud" viewBox="0 0 140 64">
      <path d="M12 52h104a14 14 0 0 0 0-28 16 16 0 0 0-29-9 19 19 0 0 0-35 2 12 12 0 0 0-18 12 11 11 0 0 0-22 23z" fill="#e8b65a" fill-opacity=".08" stroke="url(#g-gold)" stroke-width="2"/>
      <path d="M54 30a7 7 0 1 1 9 7M86 24a6 6 0 1 1 6 8M30 42a5 5 0 1 1 6 5M104 38a5 5 0 1 0 7 5" fill="none" stroke="url(#g-gold)" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-swallow" viewBox="0 0 100 60">
      <path d="M98 26C92 19 82 18 72 23 60 28 48 30 40 32L2 22l26 14L6 50l38-10c14 0 28-2 38-6 8-3 13-5 16-8z" fill="url(#g-gold)"/>
      <path d="M70 24C58 14 44 6 26 2c14 10 24 20 30 27zM66 35C56 44 46 52 34 58c14-2 26-10 36-21z" fill="url(#g-gold)" opacity=".9"/>
      <circle cx="89" cy="23.5" r="1.4" fill="#5a000d"/>
    </symbol>
    <symbol id="s-flower" viewBox="-10 -10 20 20">
      <g fill="#ffd36b" stroke="#e09a2b" stroke-width=".4">
        <circle cx="0" cy="-4.6" r="4"/><circle cx="4.4" cy="-1.4" r="4"/><circle cx="2.7" cy="3.7" r="4"/>
        <circle cx="-2.7" cy="3.7" r="4"/><circle cx="-4.4" cy="-1.4" r="4"/>
      </g>
      <circle r="2.2" fill="#e0812b"/>
      <g fill="#8a3b0c"><circle cx="0" cy="-2.8" r=".6"/><circle cx="2.6" cy="-.9" r=".6"/><circle cx="1.6" cy="2.2" r=".6"/><circle cx="-1.6" cy="2.2" r=".6"/><circle cx="-2.6" cy="-.9" r=".6"/></g>
    </symbol>
    <symbol id="s-branch" viewBox="0 0 200 140">
      <g fill="none" stroke="#7a3a12" stroke-linecap="round">
        <path d="M0 134C40 114 70 102 100 72s52-32 96-42" stroke-width="5"/>
        <path d="M100 72c4-20 14-32 30-42M60 104c10-14 10-24 20-34M150 42c10-16 20-22 34-30" stroke-width="2.6"/>
      </g>
      <use href="#s-flower" x="186" y="20" width="20" height="20"/>
      <use href="#s-flower" x="174" y="0" width="16" height="16"/>
      <use href="#s-flower" x="120" y="18" width="22" height="22"/>
      <use href="#s-flower" x="70" y="58" width="20" height="20"/>
      <use href="#s-flower" x="140" y="32" width="18" height="18"/>
      <use href="#s-flower" x="90" y="62" width="16" height="16"/>
      <use href="#s-flower" x="48" y="96" width="18" height="18"/>
      <use href="#s-flower" x="110" y="48" width="14" height="14"/>
      <g fill="#ffd36b"><circle cx="34" cy="116" r="2.6"/><circle cx="160" cy="34" r="2.4"/><circle cx="196" cy="24" r="2"/></g>
    </symbol>
    <symbol id="s-corner" viewBox="0 0 100 100">
      <g fill="none" stroke="url(#g-gold)" stroke-linecap="round">
        <path d="M4 96V32C4 16 16 4 32 4h64" stroke-width="2.4"/>
        <path d="M14 96V38c0-14 10-24 24-24h58" stroke-width="1.2"/>
        <path d="M26 26a8 8 0 1 1 10 8 5 5 0 1 1-5-5" stroke-width="1.8"/>
      </g>
      <path d="M50 4l4 4-4 4-4-4zM4 50l4 4-4 4-4-4z" fill="#e8b65a"/>
    </symbol>
  </svg>

  <div id="bg-pattern" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>
  <div id="sparks" aria-hidden="true"></div>

  <div id="intro">
    <div class="door door-left"><svg class="corner c-tl"><use href="#s-corner"/></svg><svg class="corner c-bl"><use href="#s-corner"/></svg></div>
    <div class="door door-right"><svg class="corner c-tr"><use href="#s-corner"/></svg><svg class="corner c-br"><use href="#s-corner"/></svg></div>
    <svg class="lantern intro-lantern l1"><use href="#s-lantern"/></svg>
    <svg class="lantern intro-lantern l2"><use href="#s-lantern"/></svg>
    <svg class="cloud intro-cloud k1"><use href="#s-cloud"/></svg>
    <svg class="cloud intro-cloud k2"><use href="#s-cloud"/></svg>
    <div class="intro-card">
      <p class="eyebrow">Thiệp mời cưới</p>
      <h1 class="intro-names"><span data-bind="first"></span><small>&amp;</small><span data-bind="second"></span></h1>
      <p class="intro-date" data-bind="dateDots"></p>
      <p class="intro-guest" hidden>Trân trọng kính mời<strong data-bind="guest"></strong></p>
      <button id="open-btn" class="seal" type="button" aria-label="Mở thiệp"><span>囍</span></button>
      <p class="intro-hint">Chạm để mở thiệp</p>
    </div>
  </div>

  <main id="card"></main>

  <button id="music-btn" class="music-btn" type="button" aria-label="Bật/tắt nhạc" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5l11-2v12.5a2.5 2.5 0 1 1-2-2.45V7.1L9 8.4z" fill="currentColor"/></svg>
  </button>
  <audio id="music" loop preload="none"></audio>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Đóng">×</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Ảnh trước">‹</button>
    <img alt="">
    <button class="lb-nav lb-next" type="button" aria-label="Ảnh sau">›</button>
    <p class="lb-count"></p>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/lunar.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
